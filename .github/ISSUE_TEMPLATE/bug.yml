name: Bug report
description: Report a reproducible HA Forwarder problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, or unrelated Home Assistant logs.
        Redact private hostnames and addresses when they are not needed.

  - type: input
    id: app_version
    attributes:
      label: HA Forwarder version
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.7.0"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Redacted configuration
      description: Remove or replace any private hostnames and addresses.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant App logs
      description: Include only the log lines related to this problem.
      render: text
    validations:
      required: true
