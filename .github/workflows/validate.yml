name: Validate

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: Home Assistant App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Lint App metadata
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb  # v2.21.0
        with:
          path: ./ha_forwarder

  runtime:
    name: Runtime and container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            apparmor-utils \
            jq \
            shellcheck \
            yamllint

      - name: Check YAML
        run: yamllint .

      - name: Check shell scripts
        run: shellcheck ha_forwarder/run.sh tests/test_config.sh tests/test_run.sh

      - name: Test runtime configuration
        run: |
          bash tests/test_config.sh
          bash tests/test_run.sh

      - name: Compile AppArmor profile
        run: sudo apparmor_parser --skip-kernel-load --skip-read-cache ha_forwarder/apparmor.txt

      - name: Build amd64 container
        run: |
          docker build --pull \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=ci \
            --tag ha-forwarder:ci \
            ha_forwarder
