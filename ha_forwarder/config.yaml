name: HA Forwarder
version: "0.1.0"
slug: ha_forwarder
description: Forward TCP traffic from the Home Assistant host to another TCP service.
url: https://github.com/Herbertmt978/HA_Forwarder
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: stable
host_network: true
options:
  listen_port: 5279
  target_host: ""
  target_port: 5279
schema:
  listen_port: port
  target_host: str
  target_port: port
